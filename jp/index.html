<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        @font-face {
          font-family: "irohamaru mikami";
          src: url("irohamaru mikami.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        body {
            background-color: white;
            font-family: 'irohamaru mikami';
            color: white;
        }
        body > div {
            font-size: 5vh;
            display: flex;
            flex-direction: column;
            align-Items: center;
            justify-content: center;
            width: 90vw;
            height: 40vh;
            margin: auto;
        }
        a {
            text-decoration: none;
            color: white;
        }
        .count { font-size: 0.5em; }
    </style>
  </head>
  <body style='background-color:#000'>
      <div style="background-color:#f88">
          <div><a href='meanings'>Meanings</a></div>
          <div class='count'><span id='meaning-count'></span> Reviewed</div>
      </div>
      <br>
      <div style="background-color: #88f">
          <div><a href='onyomi/'>Onyomi Readings</a></div>
          <div class='count'><span id='onyomi-count'></span> Reviewed</div>
      </div>
  </body>
  <script>
      document.getElementById('meaning-count').innerText = Object.keys(JSON.parse(localStorage.meanings || '{}')).length
      document.getElementById('onyomi-count').innerText = Object.keys(JSON.parse(localStorage.onyomi || '{}')).length
  </script>
</html>
